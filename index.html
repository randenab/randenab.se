<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Randen AB</title>
<meta name="description" content="Randen AB, Piteå. Appar och IT-konsulttjänster.">
<style>
  :root { --bg: #f7f6f3; --fg: #1d1d1b; --muted: #6b6a66; --line: #dddbd5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ecebe7; --muted: #9a9993; --line: #33322f; }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%; display: grid; place-items: center;
    padding: 48px 16px; background: var(--bg); color: var(--fg);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 32rem; }
  h1 { margin: 0 0 4px; font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--muted); }
  dl { margin: 0; padding-top: 24px; border-top: 1px solid var(--line);
       display: grid; grid-template-columns: max-content 1fr; gap: 6px 24px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  a { color: inherit; text-underline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Randen AB</h1>
  <p>Appar och IT-konsulttjänster.</p>
  <dl>
    <dt>Org.nr</dt><dd>559610-0726</dd>
    <dt>Säte</dt><dd>Piteå</dd>
    <dt>E-post</dt><dd><a href="mailto:anders@randenab.se">anders@randenab.se</a></dd>
  </dl>
</main>
</body>
</html>
